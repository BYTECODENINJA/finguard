<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <linearGradient id="fgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FF6A00"/>
    </linearGradient>
  </defs>

  <!-- ======== ICON: shield + rising fin arrow ======== -->
  <g transform="translate(60,40)">
    <!-- shield body -->
    <path d="M110 0 L220 40 V120 C220 190 170 230 110 250 C50 230 0 190 0 120 V40 Z"
          fill="#111111"/>
    <!-- inner orange accent band -->
    <path d="M110 18 L202 52 V120 C202 178 160 214 110 232 C60 214 18 178 18 120 V52 Z"
          fill="none" stroke="url(#fgGrad)" stroke-width="6"/>
    <!-- rising fin arrow (growth chart arrow) -->
    <path d="M45 160 L85 120 L115 150 L175 90" fill="none" stroke="url(#fgGrad)"
          stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M140 82 L182 82 L182 124 Z" fill="url(#fgGrad)"/>
  </g>

  <!-- ======== WORDMARK ======== -->
  <g transform="translate(330,150)">
    <text x="0" y="60" font-family="Helvetica, Arial, sans-serif" font-size="96"
          font-weight="800" letter-spacing="-2" fill="#111111">Fin<tspan fill="#FF7A00">Guard</tspan></text>
    <rect x="4" y="88" width="120" height="8" rx="4" fill="#FF7A00"/>
    <text x="0" y="140" font-family="Helvetica, Arial, sans-serif" font-size="30"
          letter-spacing="6" fill="#666666">SECURE YOUR GROWTH</text>
  </g>
</svg>